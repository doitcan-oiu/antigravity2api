services:
  antigravity2api:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:-admin-token}
      API_KEY: ${API_KEY:-sk-antigravity}
      DATA_DIR: /app/data
      BATCH_VALIDITY_DAYS: ${BATCH_VALIDITY_DAYS:-30}
      SKIP_EXPIRED_ACCOUNTS: ${SKIP_EXPIRED_ACCOUNTS:-true}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-600}
      MAX_CONCURRENT_REQUESTS: ${MAX_CONCURRENT_REQUESTS:-128}
      MAX_CONCURRENT_PER_ACCOUNT: ${MAX_CONCURRENT_PER_ACCOUNT:-4}
      MAX_RETRY_ATTEMPTS: ${MAX_RETRY_ATTEMPTS:-5}
      ADMISSION_TIMEOUT_SECONDS: ${ADMISSION_TIMEOUT_SECONDS:-5}
      SHUTDOWN_TIMEOUT_SECONDS: ${SHUTDOWN_TIMEOUT_SECONDS:-30}
    volumes:
      - ./data:/app/data
    stop_grace_period: 40s
    restart: unless-stopped
